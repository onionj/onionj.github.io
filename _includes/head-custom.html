<!--
  Light-touch styling for the Cayman theme.

  Deliberately minimal: the theme's own look (colours, fonts, heading sizes) is
  kept. The PDF and Word outputs are documents and are styled like documents in
  header.tex / build_docx.py — the site is a web page and should stay one.

  Only two things are added here:
    1. Extra breathing room above each employer, so job blocks are easy to scan.
    2. A print stylesheet, so Ctrl+P produces a clean CV instead of a web page
       with a giant banner.
-->
<style>
  /* Employers (### Company - dates) get more air above them than project
     headings, so it is obvious where one job ends and the next begins.
     Accent colour matches header.tex / build_docx.py: the site, PDF and Word
     all show employers in teal and projects in near-black, so colour (not just
     size) separates the two levels. Cayman gives every heading the same colour,
     which made a project name look like an employer. */
  .main-content h3 {
    margin-top: 2.4rem;
    color: #107878;
  }

  /* Project names (#### ...) sit closer to the bullets they introduce. */
  .main-content h4 {
    margin-top: 1.2rem;
    margin-bottom: 0.3rem;
    color: #15202b;
  }

  .main-content ul {
    margin-top: 0.4rem;
  }

  .main-content li {
    line-height: 1.6;
    margin-bottom: 0.4rem;
  }

  /* Printing the page should give a usable CV, not a screenshot of a website. */
  @media print {
    .page-header,
    #skip-to-content,
    .site-footer {
      display: none !important;
    }

    .main-content {
      max-width: 100%;
      padding: 0;
      font-size: 11pt;
      color: #15202b;
    }

    .main-content h2 {
      margin-top: 1.5rem;
    }

    .main-content h3 {
      margin-top: 1.2rem;
    }

    .main-content h4 {
      margin-top: 0.8rem;
    }
  }
</style>
