<!--
  CV styling for the Cayman theme, matching header.tex (PDF) and build_docx.py (Word).

  Design rules shared by all three outputs:
    1. Hierarchy comes from size and spacing, never from fading text out.
       A heading is never lighter than the body text under it.
    2. Colour is an accent only: name, section titles and links.
       Every job/project title stays near-black.
    3. Grey is reserved for metadata, not for headings.
    4. Single column with real text, so ATS parsers read it correctly.
-->
<style>
  :root {
    --cv-accent: #107878;
    --cv-dark: #15202b;
    --cv-meta: #5a6675;
  }

  .main-content {
    color: var(--cv-dark);
    max-width: 60rem;
  }

  /* ## Professional Summary / Work Experience */
  .main-content h2 {
    color: var(--cv-accent);
    font-size: 1.35rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border-bottom: 2px solid var(--cv-accent);
    padding-bottom: 0.3rem;
    margin-top: 2.6rem;
    margin-bottom: 0.9rem;
  }

  /* ### Company - dates, and the promoted skill/education sections */
  .main-content h3 {
    color: var(--cv-dark);
    font-size: 1.2rem;
    margin-top: 2rem;
    margin-bottom: 0.3rem;
  }

  /* #### Project name — one step smaller, same near-black */
  .main-content h4 {
    color: var(--cv-dark);
    font-size: 1.02rem;
    margin-top: 1.1rem;
    margin-bottom: 0.25rem;
  }

  .main-content ul {
    margin-top: 0.3rem;
    margin-bottom: 0.3rem;
  }

  .main-content li {
    margin-bottom: 0.35rem;
    line-height: 1.55;
  }

  .main-content a {
    color: var(--cv-accent);
  }

  /* Printing the page should look like the PDF, not like a web page. */
  @media print {
    .page-header,
    #skip-to-content {
      display: none !important;
    }

    .main-content {
      max-width: 100%;
      padding: 0;
      font-size: 11pt;
    }

    .main-content h2 {
      margin-top: 1.4rem;
    }

    .main-content h3 {
      margin-top: 1.1rem;
    }
  }
</style>
